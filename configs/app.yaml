active_lang: ja
interface_lang: zh-CN
mock_mode: false
server:
    host: 127.0.0.1
daily_target: 20
min_accuracy: 0.8
passive_enabled: true
passive_min_interval: 25
passive_max_interval: 60
escape_password_limit: 1
escape_click_limit: 2
auto_start: false
auto_expand_words: true
expand_batch_size: 10
theme: vs-dark
assignment:
    cadence_days: 0
    cadence_count: 0
    max_per_session: 0
    ai_recommend: false
session_time_budget: 0
max_slow_type_ratio: 0
sm2_max_interval_days: 180
ai:
    base_url: https://api.deepseek.com
    api_key: ""  # set via VOCABLOCK_AI_KEY env var, never commit real keys
    model: deepseek-chat
