lang:
  code: ko
  display_name: 한국어
  native_name: 韩语

tts:
  provider: edge-tts
  voice: ko-KR-SunHiNeural

# No dict provider for Korean yet — dict.yaml has no Korean provider
dict:
  provider: ""

pronounce:
  provider: ""

question_types:
  - choice
  - fill
  - pronounce
  - listening
  - reading_comp
  - grammar
  - read_word
  - read_sentence

prompt_context:
  teacher_role: 한국어 선생님
  explanation_lang: zh-CN
  level_descriptions:
    beginner: "TOPIK1-2: 1-2문장, 기본 어휘"
    intermediate: "TOPIK3-4: 3-4문장, 일상 회화"
    advanced: "TOPIK5-6: 4-6문장, 함축적 의미 이해"

word_fields_base:
  - key: word
    label: 단어
    type: text
  - key: reading
    label: 발음
    type: text
  - key: syllable_count
    label: 음절수
    type: text
  - key: pos
    label: 품사
    type: select
    options: [명사, 동사, 형용사, 부사, 조사, 감탄사, 관형사, 수사, 대명사]
  - key: meaning
    label: 의미
    type: text
  - key: level
    label: TOPIK 등급
    type: select
    options: [TOPIK1, TOPIK2, TOPIK3, TOPIK4, TOPIK5, TOPIK6]
  - key: morphology
    label: 형태
    type: text
  - key: syntax
    label: 통사 기능
    type: text
  - key: collocation
    label: 연어
    type: text
  - key: register
    label: 사용역
    type: select
    options: [구어, 문어, 격식, 비격식, 속어]
  - key: etymology
    label: 어원
    type: text
  - key: example_sentence
    label: 예문
    type: text

word_fields_dlc:
  - category: morphology
    label: 형태
    fields:
      - key: conjugation_class
        label: 활용 유형
        type: select
        options: [규칙, ㅂ불규칙, ㄷ불규칙, ㅅ불규칙, 르불규칙, 으불규칙, 러불규칙, 하다]
      - key: irregular_pattern
        label: 불규칙 상세
        type: text
  - category: writing
    label: 표기
    fields:
      - key: hanja_form
        label: 한자 표기
        type: text
      - key: orthographic_variants
        label: 표기 변이형
        type: text
  - category: honorifics
    label: 경어
    fields:
      - key: speech_level
        label: 화계
        type: select
        options: [합쇼체, 해요체, 하게체, 해체, 해라체]
      - key: honorific_pair
        label: 경어 쌍
        type: text
  - category: semantics
    label: 의미
    fields:
      - key: synonyms
        label: 유의어
        type: text
      - key: antonyms
        label: 반의어
        type: text

grammar_fields_base:
  - key: explanation
    label: 설명
    type: text
  - key: example
    label: 예문
    type: text
  - key: pattern
    label: 문형
    type: text
  - key: usage_notes
    label: 사용법
    type: text

grammar_fields_dlc:
  - category: formality
    label: 화계
    fields:
      - key: formality_level
        label: 화계 구분
        type: select
        options: [합쇼체, 해요체, 하게체, 해체, 해라체, 해당없음]
  - category: pedagogy
    label: 교육
    fields:
      - key: common_mistakes
        label: 흔한 오류
        type: text
      - key: related_points
        label: 관련 문법
        type: text
  - category: syntax
    label: 통사
    fields:
      - key: sentence_position
        label: 문장 내 위치
        type: text

grammar_points:
  - 조사 (은/는/이/가/을/를)
  - 존댓말/반말
  - 시제 (과거/현재/미래)
  - 연결어미 (고/서/면/지만)

seed_words_file: seeds/ko.json
