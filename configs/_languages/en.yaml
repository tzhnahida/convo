lang:
  code: en
  display_name: English
  native_name: 英语

tts:
  provider: edge-tts
  voice: en-US-JennyNeural

dict:
  provider: webster

pronounce:
  provider: ""

question_types:
  - choice
  - fill
  - spelling
  - pronounce
  - listening
  - reading_comp
  - grammar
  - read_word
  - read_sentence

prompt_context:
  teacher_role: English Teacher
  explanation_lang: zh-CN
  level_descriptions:
    beginner: "A1-A2: 1-2 sentences, basic vocabulary"
    intermediate: "B1-B2: 3-4 sentences, everyday conversation"
    advanced: "C1: 4-6 sentences, read between the lines"

word_fields_base:
  - key: word
    label: Word
    type: text
  - key: reading
    label: Pronunciation
    type: text
  - key: syllable_count
    label: Syllables
    type: text
  - key: pos
    label: Part of Speech
    type: select
    options: [noun, verb, adjective, adverb, preposition, conjunction, interjection, pronoun, determiner]
  - key: meaning
    label: Meaning
    type: text
  - key: level
    label: CEFR Level
    type: select
    options: [A1, A2, B1, B2, C1, C2]
  - key: morphology
    label: Morphology
    type: text
  - key: syntax
    label: Syntax
    type: text
  - key: collocation
    label: Collocations
    type: text
  - key: register
    label: Register
    type: select
    options: [neutral, formal, informal, slang, literary, technical]
  - key: etymology
    label: Etymology
    type: text
  - key: example_sentence
    label: Example Sentence
    type: text

word_fields_dlc:
  - category: phonology
    label: Phonology
    fields:
      - key: ipa
        label: IPA Transcription
        type: text
      - key: stress_pattern
        label: Stress Pattern
        type: text
      - key: homophones
        label: Homophones
        type: text
  - category: morphology
    label: Morphology
    fields:
      - key: irregular_forms
        label: Irregular Forms
        type: text
      - key: plural_form
        label: Plural Form
        type: text
      - key: past_participle
        label: Past Participle
        type: text
  - category: syntax_usage
    label: Syntax & Usage
    fields:
      - key: phrasal_verbs
        label: Phrasal Verbs
        type: text
      - key: preposition_governed
        label: Governed Prepositions
        type: text
  - category: semantics
    label: Semantics
    fields:
      - key: synonyms
        label: Synonyms
        type: text
      - key: antonyms
        label: Antonyms
        type: text

grammar_fields_base:
  - key: explanation
    label: Explanation
    type: text
  - key: example
    label: Example
    type: text
  - key: pattern
    label: Pattern
    type: text
  - key: usage_notes
    label: Usage Notes
    type: text

grammar_fields_dlc:
  - category: formality
    label: Formality
    fields:
      - key: formality_level
        label: Formality Level
        type: select
        options: [neutral, formal, informal, literary, N/A]
  - category: pedagogy
    label: Pedagogy
    fields:
      - key: common_mistakes
        label: Common Mistakes
        type: text
      - key: related_points
        label: Related Points
        type: text
  - category: syntax
    label: Syntax
    fields:
      - key: sentence_position
        label: Sentence Position
        type: text
      - key: clause_type
        label: Clause Type
        type: text

grammar_points:
  - Tenses (Present/Past/Future)
  - Articles (a/an/the)
  - Prepositions (in/on/at)
  - Conditionals (if/would)

seed_words_file: seeds/en.json
