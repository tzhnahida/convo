tts:
  cache_limit: 500
  fallback_order: [edge-tts, sapi]
  providers:
    edge-tts:
      binary: 'python'
      args:
        - 'tts/ms_edge_tts.py'
        - '--voice'
        - '{voice}'
        - '--text'
        - '{text}'
        - '--write-media'
        - '{output}'
      format: mp3
      voices:
        ja: ja-JP-NanamiNeural
        en: en-US-JennyNeural
        zh: zh-CN-XiaoxiaoNeural
        ko: ko-KR-SunHiNeural
    sapi:
      binary: 'powershell'
      args:
        - '-File'
        - 'tts\sapi\speak.ps1'
        - '-Lang'
        - '{lang}'
        - '-Text'
        - '{text}'
        - '-Output'
        - '{output}'
      format: wav
